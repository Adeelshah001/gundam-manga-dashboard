name: Auto-Update Gundam Manga Solicitations

on:
  schedule:
    # Runs every day at 06:00 UTC (daily check for new Gundam manga volumes + buy-link verification)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows one-click manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sort Catalog
        run: |
          python sort_catalog.py

      - name: Discover New Volumes (PRH sitemaps + publisher series pages)
        run: |
          python discover_new_volumes.py

      - name: Verify Buy Links (Amazon / PRH / Indigo / VIZ / publishers)
        run: |
          python check_buy_links.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gundam_manga.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new changes to catalog."
          else
            git commit -m "chore(catalog): auto-update Gundam manga catalog + verify buy links [skip ci]"
            git push
          fi
